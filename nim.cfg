# --- Global Standard Libs (Always needed) ---
exceptions:setjmp
debugger:native
linedir:on
threads:on
define:useMalloc
define:openmp
define:danger

cc:gcc

passL:"-lm"
passL:"-lrt"
passL:"-lpthread"
passL:"-ldl"



@if bundle:
  # --- Bundles HTSlib only ---
  debuginfo:off
  dynlibOverride:"hts"
  passL:"/home/andyjasonowicz/build/fst-gl/static-build/lib/libhts.a"
  passL:"/home/andyjasonowicz/build/fst-gl/static-build/lib64/libdeflate.a"
  passL:"-lz"
  passL:"-lbz2"
  passL:"-llzma"
  passL:"-fopenmp"

  passC: "-Wno-incompatible-pointer-types"

@elif release:  
  debuginfo:off
  dynlibOverride:"hts"
  dynlibOverride:"z"
  dynlibOverride:"bz2"
  dynlibOverride:"lzma"
  dynlibOverride:"openmp"

  # GCC only needs this to handle the pragmas
  passC: "-fopenmp"

  # Link the static GCC library directly
  passL: "/opt/rh/gcc-toolset-14/root/usr/lib/gcc/x86_64-redhat-linux/14/libgomp.a"

  # Your other static libraries
  passL: "/usr/lib64/libhts.a"
  passL: "/usr/lib64/libdeflate.a"
  passL: "/usr/lib64/libz.a"
  passL: "/usr/lib64/libbz2.a"
  passL: "/usr/lib64/liblzma.a"

  # Standard system libs for portability
  passL: "-lpthread"
  passL: "-lm"
  passL: "-lrt"
  passL: "-ldl"
  passL: "-s"
@else:
  passL:"-fopenmp"
  passC: "-Wno-incompatible-pointer-types"

@end


